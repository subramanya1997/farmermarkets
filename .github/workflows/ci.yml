name: CI

# The nightly data refresh (update-government-markets.yml) already runs
# `bun run test` and `bun run build`, but only once a day and only on the schedule
# — a push that broke the site sat undetected until the next 08:17 UTC run, and
# nothing anywhere exercised the three checks that need a running server.
# This workflow is the per-change gate: build the site, serve it, and run every
# check against the real HTML.
#
# Two jobs run side by side so nobody waits on lint while the build runs, and
# the build prerenders a sample of market pages rather than all of them. The
# time budget, the measurements behind these choices and the experiments that
# were tried are in docs/ci-performance.md. Read it before adding a step.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch or PR; a new push supersedes an in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no build: about 45 seconds.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node stays for the test scripts (`node --test --experimental-strip-types`);
      # Bun is the package manager and script runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bunx tsc --noEmit

      # Offline unit suites plus the SEO smoke tests, which skip themselves
      # here because nothing is listening. They run for real in the build job.
      - name: Unit tests
        run: bun run test

  # The long pole: build, serve, and check the real HTML.
  build:
    runs-on: ubuntu-latest
    # A sampled build takes under two minutes; this leaves room for a full one
    # if the sample is ever switched off.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Prerender 500 of the ~9,000 market pages, spread evenly across the
          # list. They share one template, and the rest still render on demand
          # for the route checks below. City pages, state hubs and everything
          # else prerender in full. Production (Vercel) and the nightly data
          # refresh leave this unset and prerender every page.
          PRERENDER_MARKET_SAMPLE: 500
          # The checks job type-checks; doing it again here bought nothing.
          SKIP_BUILD_TYPECHECK: 1

      - name: Start the server
        run: |
          bun run start &
          echo "$!" > "$RUNNER_TEMP/server.pid"
          # `bun run start` returns before Next is accepting connections, so poll
          # rather than sleeping a guessed number of seconds.
          for attempt in $(seq 1 60); do
            if curl -sfo /dev/null http://localhost:3000/; then
              echo "server up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up within 60s"
          exit 1

      # The three server-dependent checks. Each is a separate step so a failure
      # names itself in the job summary instead of hiding inside a shell chain.
      - name: SEO smoke tests
        run: bun run test:seo
        env:
          MARKET_BASE_URL: http://localhost:3000

      - name: Market and sitemap route checks
        run: bun run test:market-routes
        env:
          MARKET_BASE_URL: http://localhost:3000

      - name: Topic page checks
        run: bun run test:topic-routes
        env:
          MARKET_BASE_URL: http://localhost:3000

      - name: Stop the server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/server.pid")" || true
