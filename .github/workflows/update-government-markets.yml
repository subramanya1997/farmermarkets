name: Update official government market data

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-government-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Node stays for the test scripts (`node --test --experimental-strip-types`);
      # Bun is the package manager and script runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # The refresh submits the URLs it changed to IndexNow. A failed
      # submission is only a warning, so it can never fail this step; set the
      # repository variable INDEXNOW_DISABLE to 1 to switch submissions off.
      - id: update_data
        continue-on-error: true
        env:
          INDEXNOW_DISABLE: ${{ vars.INDEXNOW_DISABLE }}
        run: bun run data:update

      - run: bun run test

      - run: bun run data:check

      - run: bun run build

      - name: Commit a validated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/government_markets.json public/data/government_markets.manifest.json
          if git diff --cached --quiet; then
            echo "No generated data changes"
          else
            git commit -m "data: refresh official government markets"
            git push
          fi

      - name: Report partial source failures
        if: steps.update_data.outcome == 'failure'
        run: |
          echo "One or more sources failed. Successful sources were updated and last-good records were retained for failed sources."
          exit 1
